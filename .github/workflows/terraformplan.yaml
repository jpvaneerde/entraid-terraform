name: "Terraform Plan & Validate (Manual)"

# This enables the "Run workflow" button in the GitHub UI
on:
  workflow_dispatch:

permissions:
  id-token: write      # Required for Azure OIDC authentication
  contents: read       # Required to clone the repository code

jobs:
  validate:
    name: "Format, Validate & Plan"
    runs-on: ubuntu-latest
    environment: prod  # Connects to your 'prod' environment secrets

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend-config=backend.config

      - name: Terraform Validate
        run: terraform validate -no-color

      # This runs the plan and displays the output directly inside the GitHub Action log console
      - name: Terraform Plan
        run: terraform plan -no-color -input=false
